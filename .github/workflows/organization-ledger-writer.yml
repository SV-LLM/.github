name: Organization Ledger Writer

# G17-WORKFLOW-SURFACE-MINIMIZATION (StegVerse-Labs/.github#167/#168), enforced
# retroactively under Rigel's 2026-10-24 direction; owner P1 (StegVerse-org/.github#163).
# Model: StegVerse-org/.github#238 @70ce02af .github/workflows/organization-ledger-writer.yml.
# The organization ledger / InTr writers of SV-LLM/.github are one workflow with
# one lifecycle (push to main, contents: write on the designated ledger ref, one
# appender at a time).
#
# The chain is internal and keyed by state transition, not by a workflow name:
#   plan               which writer transitions this push carries, read from the
#                      manifest control/workflow-surface-registry.json
#                      (writer_jobs[].paths) against the pushed range
#   merge-transfer     every push to main (StegVerse-Labs/.github / StegVerse-org/.github
#                      organization-ledger-merge-transfer.yml, installed here by
#                      SV-LLM/.github#50 c0444fbc, byte-identical source)
#   path-transfer      after a successful merge-transfer (#50 intr-path-transfer.yml,
#                      was workflow_run on "Organization Ledger Main Merge Transfer")
#   path-ingress       after a successful merge-transfer (#50 intr-path-ingress.yml,
#                      the same workflow_run)
#   ledger-transition  when .stegverse/transition-requests/** changed
#                      (was organization-ledger-transition.yml, dispatch-only)
# Jobs run one after another because each publishes the same ledger ref
# fast-forward only. Their steps are the original steps unchanged except that
# github.event.workflow_run.head_sha is github.sha (the same commit: the
# workflow_run head of a push to main is that push), retry entrypoints name this
# file, and ledger-transition's MODE defaults to the committed-request mode.
#
# workflow_dispatch is removed (ACTION_BY_MANIFEST). The dispatch-only
# self-closure mode is FAIL_CLOSED pending in the registry; its steps stay in
# place and are unreachable on push, where github.event.inputs is empty.
# Source validation and merge confer no runtime authority: runtime counts only
# when a manifest-directed transition appends a receipt on the ledger ref.
on:
  push:
    branches: [main]

permissions:
  contents: read

# ORGANIZATION_LEDGER_LOCK: one appender at a time. The fast-forward push is
# the compare-and-swap against the published ref.
concurrency:
  group: organization-ledger
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ledger-transition: ${{ steps.plan.outputs.ledger-transition }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the writer transitions this push carries
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 tools/tasks/writer_plan.py --before "$BEFORE" --after "$GITHUB_SHA" >> "$GITHUB_OUTPUT"


  # Folded from .github/workflows/organization-ledger-merge-transfer.yml (job `append`).
  # A merge on main is a state transition within this organization
  # (.stegverse/transition-ledger/org-contract.json organization_scope_rule:
  # EVERY_STATE_TRANSITION_OCCURRING_WITHIN_THE_ORGANIZATION_EMITS_AN_ORGANIZATION_RECEIPT).
  # The push that lands the merge is the trigger. There is no dispatch, schedule
  # or cross-repository call: the append is made in this repository, onto this
  # organization's own designated ledger ref, with this run's GITHUB_TOKEN.
  #
  # Each merge gets one repository receipt and one organization receipt through
  # the existing two-level append (resident-runtime/intr_destination_ingress.py
  # _append over emit.py / aggregate_repo_transition.py / ledger_store.py),
  # operation ORGANIZATION_MAIN_MERGE_TRANSFER, at the supplied epoch carried by
  # the ledger head (no clock). The transfer is VERIFIED only by
  # resident-runtime/merge_transfer.py verify on a fresh fetch of the published
  # ref; this run's success is not the evidence.
  #
  # Writer only. The PR-facing checks are
  # .github/workflows/organization-ledger-merge-transfer-validation.yml.
  # ORGANIZATION_LEDGER_LOCK: one appender at a time, shared with
  # organization-ledger-transition.yml. The fast-forward push is the
  # compare-and-swap against the published ref.
  merge-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          ref=$(python3 -c 'import json; print(json.load(open(".stegverse/transition-ledger/org-contract.json")).get("organization_ledger_ref") or "refs/stegverse/organization-ledger")')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          # No head, no supplied epoch: the append below refuses (HB_EPOCH_SOURCE_UNOBSERVED).
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"

      - name: Select the merges this push carries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          # pending merges, then the push's base when it is on main with no receipt, then the pushed range
          # (resident-runtime/merge_transfer_range.py); the base is checked on the ledger about to be appended to
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer_range.py --before "$BEFORE" --after "$GITHUB_SHA" \
            --pending .stegverse/merge-transfer/pending.json > "$RUNNER_TEMP/results/commits.txt"
          cat "$RUNNER_TEMP/results/commits.txt"

      - name: Append each merge's repository and organization receipts
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer.py append --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/append.json"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run the push)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a merge already ledgered is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each transfer from a fresh fetch of the published ref
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer.py verify --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/verify.json"
          { echo '### main merge transfer'; echo '```json'; cat "$RUNNER_TEMP/results/verify.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-merge-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/results

  # Folded from .github/workflows/intr-path-transfer.yml (job `append`).
  # A transfer over a declared InTr mesh path is a state transition within this
  # organization. Landing a row of .stegverse/intr-path-transfer/transfers.json on
  # main is the transition; the push that lands it is ledgered first by
  # organization-ledger-merge-transfer.yml, and this writer runs when that
  # workflow completes for a push to main (workflow_run: an event of the push,
  # not a dispatch; there is no workflow_dispatch, schedule or cross-repository
  # call). Each declared transfer not yet ledgered gets one repository receipt and
  # one organization receipt (operation INTR_MESH_PATH_TRANSFER) through the
  # existing two-level append, at the supplied epoch on the ledger head (no clock),
  # linked to the push's main-merge transfer receipt. A transfer already ledgered
  # is answered from the ledger. Path receipts are verified by
  # resident-runtime/intr_path_transfer.py verify on a fresh fetch of the
  # published ref; the destination half stays FAIL_CLOSED class B until a carrier
  # and a TV/TVC-issued cross-organization read credential exist.
  #
  # Writer only. The PR-facing checks are intr-path-transfer-validation.yml.
  path-transfer:
    needs: [merge-transfer]
    if: needs.merge-transfer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      TRANSFER_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Append each declared path transfer, linked to this push's main-merge transfer
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_transfer.py append --transfer-commit "$TRANSFER_COMMIT" \
            --out "$RUNNER_TEMP/results/append.json"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a ledgered path transfer is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each path from a fresh fetch of the published ref
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_transfer.py verify --expect-source ALLOW --out "$RUNNER_TEMP/results/verify.json" > /dev/null
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps(r["counts"]))' "$RUNNER_TEMP/results/verify.json"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intr-path-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/results

  # Folded from .github/workflows/intr-path-ingress.yml (job `append`).
  # The destination half of an InTr mesh path. A row of
  # .stegverse/intr-path-transfer/inbound.json landing on this organization's main
  # carries copies of a source organization's sealed path receipts; landing it is
  # the transition. This writer runs when organization-ledger-merge-transfer.yml
  # completes for that push (workflow_run: an event of the push, not a dispatch;
  # no workflow_dispatch, schedule or cross-repository call). Each carried pair
  # that is sealed, linked and names this destination is consumed by
  # resident-runtime/intr_path_ingress.py through the destination ingress
  # two-level append (operation ORGANIZATION_INTR_DESTINATION_INGRESS, supplied
  # epoch on the ledger head, no clock); the receipts carry both source seals. A
  # row already ledgered is answered from the ledger. The carried pair's inclusion
  # in the source ledger is read anonymously when the source's .github is public
  # (E0, no credential); otherwise it is recorded FAIL_CLOSED
  # INTR_PATH_CROSS_ORG_READ_CREDENTIAL_NOT_ISSUED (TV/TVC route).
  #
  # Writer only. The PR-facing checks are intr-path-transfer-validation.yml.
  path-ingress:
    needs: [merge-transfer, path-transfer]
    if: ${{ !cancelled() && needs.merge-transfer.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Read each inbound row's source ledger anonymously (public sources only; no credential)
        run: |
          set -euo pipefail
          pub="$RUNNER_TEMP/public-ledgers"; mkdir -p "$pub"; echo "STEGVERSE_INTR_PUBLIC_LEDGERS=$pub" >> "$GITHUB_ENV"
          [ -f .stegverse/intr-path-transfer/inbound.json ] || exit 0
          for org in $(python3 -c 'import json; print(" ".join(sorted({r["path_id"].split("->")[0] for r in json.load(open(".stegverse/intr-path-transfer/inbound.json"))["transfers"]})))'); do
            git init -q --bare "$pub/$org.git"
            if ! GIT_TERMINAL_PROMPT=0 git --git-dir="$pub/$org.git" -c credential.helper= -c http.https://github.com/.extraheader= \
                fetch -q --no-tags "https://github.com/$org/.github" "+$LEDGER_REF:$LEDGER_REF"; then
              rm -rf "$pub/$org.git"; echo "NOT_ANONYMOUSLY_READABLE $org (TV/TVC route applies; FAIL_CLOSED until a TVC read receipt verifies)"
            fi
          done

      - name: Consume each inbound row through the destination ingress
        run: |
          set -euo pipefail
          if [ ! -f .stegverse/intr-path-transfer/inbound.json ]; then
            echo "no inbound rows; no transition"; echo "NO_INBOUND=1" >> "$GITHUB_ENV"; exit 0
          fi
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_ingress.py consume --out "$RUNNER_TEMP/results/consume.json"

      - name: Publish the ledger ref (fast-forward only)
        if: env.NO_INBOUND != '1'
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a ledgered inbound row is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each inbound row from a fresh fetch of the published ref
        if: env.NO_INBOUND != '1'
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_ingress.py verify --out "$RUNNER_TEMP/results/verify.json" > /dev/null
          python3 -c 'import json,sys; [print(r["disposition"], r["path_id"]) for r in json.load(open(sys.argv[1]))]' "$RUNNER_TEMP/results/verify.json"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intr-path-ingress-${{ github.sha }}
          path: ${{ runner.temp }}/results

  # Folded from .github/workflows/organization-ledger-transition.yml (job `transition`).
  # Action by manifest: a transition request committed under
  # .stegverse/transition-requests/ is built into a manifest by the pinned SDK,
  # received on this organization's ingress, appended to the repository ledger
  # and then the organization ledger on the designated ref, published fast-forward
  # only, and read back. On push the kernel epoch rule refuses a request that
  # carries no supplied epoch (HB_EPOCH_NOT_SUPPLIED, six fields) before anything
  # is received, exactly as the dispatch-only workflow refused a push-shaped run.
  # mode=self-closure is dispatch-only and unreachable here (FAIL_CLOSED pending).
  ledger-transition:
    needs: [plan, merge-transfer, path-transfer, path-ingress]
    if: ${{ !cancelled() && needs.plan.outputs.ledger-transition == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      # A push runs the committed-request mode (G17: was `|| 'self-closure'`; a dispatch named its mode).
      MODE: ${{ github.event.inputs.mode || 'request' }}
      HB_EPOCH: ${{ github.event.inputs.hb_epoch }}
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      # The manifest owner, at the pin every StegVerse-org workflow uses
      # (StegVerse-org/.github#179; StegVerse-SDK#530, after #520 removed its
      # only third-party import). Checked out, not installed: the package is
      # put on PYTHONPATH and nothing is downloaded from a package index.
      - name: Checkout exact merged SDK manifest state-transition runtime
        if: env.MODE == 'request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: StegVerse-org/StegVerse-SDK
          ref: 74d9b473aa415b06a9d550c28b2779a691b4ba32
          path: sdk
          persist-credentials: false

      - name: Put the pinned SDK on the import path
        if: env.MODE == 'request'
        run: |
          set -euo pipefail
          test "$(git -C sdk rev-parse HEAD)" = 74d9b473aa415b06a9d550c28b2779a691b4ba32
          echo "PYTHONPATH=$GITHUB_WORKSPACE/sdk" >> "$GITHUB_ENV"
          PYTHONPATH="$GITHUB_WORKSPACE/sdk" python -c 'import stegverse.manifest_builder, stegverse.manifest_contract, stegverse.manifest_state_transition_runtime, stegverse.remediation_fork; print("sdk importable")'

      - name: Validate committed requests and the readback implementation before any append
        run: |
          python -m py_compile resident-runtime/intr_destination_ingress.py \
            resident-runtime/organization_ledger_readback.py \
            resident-runtime/organization_manifest_ingress.py \
            resident-runtime/manifest_directed_run_inputs.py
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path(".stegverse/transition-ledger/org-contract.json").read_text())
          assert contract["organization_ledger_repository"] == "SV-LLM/.github"
          assert contract["organization_ledger_ref"] == "refs/stegverse/organization-ledger"
          # The repository ledger lives in a subtree of the same designated ref
          # (contract.json repository_ledger_location); no second ref is named.
          location = json.loads(Path(".stegverse/transition-ledger/contract.json").read_text())["repository_ledger_location"]
          assert location["repository"] == contract["organization_ledger_repository"]
          assert location["ref"] == contract["organization_ledger_ref"]
          assert location["new_ledger_root"] is False and location["namespace"]
          for path in Path(".stegverse/transition-requests").glob("*.json"):
              request = json.loads(path.read_text())
              assert request["owning_existing_goal"] and request["standing"]
              # Exactly one manifest form: build_manifest arguments, or the exact
              # already-built manifest with its canonical digest.
              assert ("build_manifest" in request) != ("manifest" in request), path
          PY

      - name: Bind the designated organization ledger ref and the repository ledger subtree within it
        run: |
          set -euo pipefail
          ref=$(python -c 'import json; c=json.load(open(".stegverse/transition-ledger/org-contract.json")); assert c["organization_ledger_repository"]=="SV-LLM/.github", c; print(c["organization_ledger_ref"])')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "repository ledger subtree: $namespace"
          # The leading + updates this runner's view of the published ref.
          # It is not a push. The publish step below is fast-forward only.
          if git ls-remote --exit-code origin "$LEDGER_REF" >/dev/null; then
            git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
            echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          else
            echo "ledger ref not yet materialized; the first append opens it"
          fi

      - name: Select committed transition requests
        if: env.MODE == 'request'
        env:
          INPUT_REQUEST: ${{ github.event.inputs.request }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_REQUEST" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"DISPATCH_REQUEST_REQUIRED","failed_predicate":"MODE_REQUEST_NAMES_A_COMMITTED_TRANSITION_REQUEST","required_evidence_or_repair":"dispatch with request=.stegverse/transition-requests/<id>.json","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"SVORG-LLM-ORG-FOUNDATION-001","next_attempt":"re-dispatch naming a committed request"}'
            exit 1
          fi
          if [ -n "$INPUT_REQUEST" ]; then
            # A dispatch may select only an existing, committed transition
            # request from the checked-out revision, never an arbitrary path.
            case "$INPUT_REQUEST" in
              .stegverse/transition-requests/*.json) ;;
              *) echo "FAIL_CLOSED: DISPATCH_REQUEST_OUTSIDE_COMMITTED_TRANSITION_REQUESTS" >&2; exit 1 ;;
            esac
            case "$INPUT_REQUEST" in
              *../*|*/../*|*' '*) echo "FAIL_CLOSED: DISPATCH_REQUEST_PATH_INVALID" >&2; exit 1 ;;
            esac
            # Reject control characters, including newline and carriage return,
            # without interpolating the input into shell source.
            if ! INPUT_REQUEST="$INPUT_REQUEST" python -c 'import os,sys; p=os.environ["INPUT_REQUEST"]; sys.exit(0 if all(32 <= ord(c) <= 126 for c in p) else 1)'; then
              echo "FAIL_CLOSED: DISPATCH_REQUEST_CONTROL_CHARACTER" >&2
              exit 1
            fi
            if ! git ls-files --error-unmatch -- "$INPUT_REQUEST" >/dev/null 2>&1 || [ ! -f "$INPUT_REQUEST" ]; then
              echo "FAIL_CLOSED: DISPATCH_REQUEST_NOT_COMMITTED" >&2
              exit 1
            fi
            printf '%s\n' "$INPUT_REQUEST" > "$RUNNER_TEMP/requests.txt"
          else
            git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- '.stegverse/transition-requests/*.json' > "$RUNNER_TEMP/requests.txt"
          fi
          cat "$RUNNER_TEMP/requests.txt"

      - name: Receive each request and append to the repository and organization ledgers
        if: env.MODE == 'request'
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          # Same ref, own subtree: the repository chain is published by the same
          # fast-forward push below (contract.json repository_ledger_location).
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          mkdir -p "$RUNNER_TEMP/results"
          # This organization has no mesh lane for a committed request: it
          # declares no outbound destination one could leave on. A request that
          # declares mesh_root is refused here, before anything is received or
          # recorded, so it is not spent without the emission it asked for.
          if ! resolved=$(python resident-runtime/manifest_directed_run_inputs.py transition-mesh \
              --dispatch-mesh-root "" --requests "$RUNNER_TEMP/requests.txt"); then
            echo "$resolved"; exit 1
          fi
          echo "$resolved"
          mesh_root=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["mesh_root"])' "$resolved")
          if [ -n "$mesh_root" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"MESH_LANE_NOT_ADOPTED","failed_predicate":"A_COMMITTED_REQUEST_HERE_DECLARES_NO_MESH_ROOT","required_evidence_or_repair":"adopt the reference mesh lane (resident-runtime/mesh_locator_binding.py and an outbound destination binding) before committing a request that declares mesh_root","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"SVORG-LLM-ORG-FOUNDATION-001","next_attempt":"commit a successor request without mesh_root, or adopt the mesh lane first"}'
            exit 1
          fi
          while IFS= read -r request; do
            [ -n "$request" ] || continue
            name=$(basename "$request" .json)
            out="$RUNNER_TEMP/results/$name"
            mkdir -p "$out"
            python - "$request" "$out" <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          from stegverse.manifest_builder import build_manifest
          from stegverse.manifest_contract import validate_ingress_manifest
          request = json.loads(Path(sys.argv[1]).read_text())
          out = Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location("ingress", "resident-runtime/organization_manifest_ingress.py")
          ingress = importlib.util.module_from_spec(spec); spec.loader.exec_module(ingress)
          spec = importlib.util.spec_from_file_location("inputs", "resident-runtime/manifest_directed_run_inputs.py")
          inputs = importlib.util.module_from_spec(spec); spec.loader.exec_module(inputs)
          def canonical_of(manifest):
              validate_ingress_manifest(manifest)
              return ingress.derive_execution_request(manifest, ingress.boundary())["canonical_manifest_sha256"]
          resolved = inputs.committed_manifest(request, build=build_manifest, canonical_of=canonical_of)
          if resolved["disposition"] != "ALLOW":
              print(json.dumps(resolved, sort_keys=True))
              sys.exit(1)
          manifest, canonical = resolved["manifest"], resolved["canonical_manifest_sha256"]
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          (out / "standing.json").write_text(json.dumps(request["standing"], indent=2, sort_keys=True) + "\n")
          (out / "canonical_manifest_sha256").write_text(canonical)
          print("built", request["request_id"], "canonical manifest", canonical)
          PY
            canonical=$(cat "$out/canonical_manifest_sha256")
            recorded=$(python resident-runtime/organization_ledger_readback.py \
              --location "$STEGVERSE_ORG_LEDGER_ROOT" --recorded-for "$canonical")
            if [ -n "$recorded" ]; then
              echo "already recorded as $recorded; one manifest is one transition, nothing appended"
              python -c 'import json,sys; json.dump({"disposition":"ALREADY_RECORDED","organization_receipt_sha256":sys.argv[1],"canonical_manifest_sha256":sys.argv[2]}, open(sys.argv[3],"w"))' \
                "$recorded" "$canonical" "$out/ingress.json"
              continue
            fi
            # Time is supplied with the dispatch. It is not sampled from a clock,
            # so a request that would append without one, or with an invalid one,
            # fails closed here with the kernel's six-field refusal and nothing is
            # received, appended or published (B-P31). A push carries no input, and
            # a dispatch string input cannot tell "" from absent, so both are
            # HB_EPOCH_NOT_SUPPLIED; any other text is the kernel rule's to decide,
            # so a dispatched "+33" is HB_EPOCH_INVALID (B-P36d).
            python -B -c 'import importlib.util,json,os,sys; s=importlib.util.spec_from_file_location("kernel","org-kernel/kernel.py"); k=importlib.util.module_from_spec(s); s.loader.exec_module(k); v=(os.environ.get("HB_EPOCH") or None) if os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch" else None; r=k.writer_epoch_refusal(v,retry_entrypoint=sys.argv[1]); r is None or print(json.dumps(r,sort_keys=True)); sys.exit(0 if r is None else 1)' ".github/workflows/organization-ledger-writer.yml (dispatch mode=request with hb_epoch)" || exit 1
            # A refusal is recorded too; the publish step carries it, and the
            # readback step fails the run on a receipt it cannot find.
            python resident-runtime/organization_manifest_ingress.py \
              --hb-epoch "$HB_EPOCH" \
              --registry org-boundary/registry/services.json \
              --manifest "$out/manifest.json" --standing "$out/standing.json" \
              --packet-id "$name" --out "$out/ingress.json" || true
            test -f "$out/ingress.json"
            python -c 'import json,sys; x=json.load(open(sys.argv[1])); print("ingress disposition:", x["disposition"], x.get("failed_predicate"), x.get("organization_receipt_sha256"))' "$out/ingress.json"
          done < "$RUNNER_TEMP/requests.txt"

      # mode=self-closure: this organization's own intr-destination, at the
      # supplied epoch. No peer is named; the address is derived from this
      # organization's own name.
      - name: Close an intr-destination diagnostic against this organization
        if: env.MODE == 'self-closure'
        env:
          INPUT_COMMUNICATION_ID: ${{ github.event.inputs.communication_id }}
          INPUT_PACKET_ID: ${{ github.event.inputs.packet_id }}
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          # Same ref, own subtree: the repository chain is published by the same
          # fast-forward push below (contract.json repository_ledger_location).
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          mkdir -p "$RUNNER_TEMP/results/self-closure"
          out="$RUNNER_TEMP/results/self-closure"
          packet_id="$INPUT_PACKET_ID"
          if [ -z "$packet_id" ]; then
            packet_id="intr-destination-self-closure-${GITHUB_RUN_ID}"
          fi
          # Time is supplied with the dispatch. It is not sampled from a clock.
          # An absent or invalid epoch fails closed with the kernel's six-field
          # refusal and nothing is appended (B-P36c). A dispatched "" cannot be told
          # from an absent input and is HB_EPOCH_NOT_SUPPLIED; any other text is the
          # kernel rule's to decide (B-P36d).
          python -B -c 'import importlib.util,json,os,sys; s=importlib.util.spec_from_file_location("kernel","org-kernel/kernel.py"); k=importlib.util.module_from_spec(s); s.loader.exec_module(k); v=(os.environ.get("HB_EPOCH") or None) if os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch" else None; r=k.writer_epoch_refusal(v,retry_entrypoint=sys.argv[1]); r is None or print(json.dumps(r,sort_keys=True)); sys.exit(0 if r is None else 1)' ".github/workflows/organization-ledger-writer.yml (dispatch mode=self-closure with hb_epoch)" || exit 1
          python resident-runtime/intr_destination_ingress.py \
            --self-close \
            --hb-epoch "$HB_EPOCH" \
            --registry org-boundary/registry/services.json \
            --communication-id "$INPUT_COMMUNICATION_ID" \
            --packet-id "$packet_id" \
            --out "$out/closure.json"
          python -c 'import json,sys; x=json.load(open(sys.argv[1])); print("closure disposition:", x["disposition"], x.get("communication_id"), x.get("organization_receipt_sha256"))' "$out/closure.json"

      # Every receipt this run appended is published. A lost compare-and-swap
      # publishes nothing. The push refspec has no leading +, so a push that
      # is not a fast-forward is refused.
      - name: Publish the ledger ref (fast-forward only)
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${LEDGER_REF:-}" ]; then
            echo "ledger ref was not bound; nothing to publish"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "$LEDGER_REF" >/dev/null; then
            echo "nothing appended; ledger ref not materialized"
            exit 0
          fi
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"LLMA-DECLARED-PATH-CONFORMANCE-368","next_attempt":"re-run; a closure or request already on the published ref is answered from the ledger"}'
            exit 1
          fi
          echo "published $LEDGER_REF at $(git rev-parse "$LEDGER_REF")"

      - name: Read the organization and repository ledgers back from a fresh fetch
        if: always() && env.MODE == 'request'
        run: |
          set -euo pipefail
          if [ -z "${REPO_LEDGER_NAMESPACE:-}" ]; then
            echo "ledger ref was not bound"
            exit 1
          fi
          if ! ls "$RUNNER_TEMP"/results/*/ingress.json >/dev/null 2>&1; then
            echo "no request was received by this run; nothing to read back"
            exit 0
          fi
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"AUTHENTICATED_LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_AUTHENTICATED","required_evidence_or_repair":"checkout credentials unavailable for independent sovereign ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"LLMA-DECLARED-PATH-CONFORMANCE-368","next_attempt":"retry with authorized existing repository contents token"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          status=0
          for out in "$RUNNER_TEMP"/results/*/; do
            [ -f "$out/ingress.json" ] || continue
            python resident-runtime/organization_ledger_readback.py \
              --location "git+$fresh#$LEDGER_REF" --ingress-result "$out/ingress.json" \
              --manifest "$out/manifest.json" --repository-namespace "$REPO_LEDGER_NAMESPACE" \
              --out "$out/readback.json" || status=1
            {
              echo "### $(basename "$out")"
              echo '```json'
              cat "$out/readback.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - name: Read the intr-destination self-closure back from a fresh fetch
        if: always() && env.MODE == 'self-closure'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/results/self-closure"
          if [ ! -f "$out/closure.json" ]; then
            echo "no closure result to read back"
            exit 0
          fi
          if [ -z "${LEDGER_REF:-}" ] || [ -z "${REPO_LEDGER_NAMESPACE:-}" ]; then
            echo "ledger ref was not bound"
            exit 1
          fi
          fresh="$RUNNER_TEMP/self-closure-readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"AUTHENTICATED_LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_AUTHENTICATED","required_evidence_or_repair":"checkout credentials unavailable for independent sovereign ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"LLMA-DECLARED-PATH-CONFORMANCE-368","next_attempt":"retry with authorized existing repository contents token"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python resident-runtime/intr_destination_ingress.py \
            --verify-self-closure \
            --location "git+$fresh#$LEDGER_REF" \
            --repository-namespace "$REPO_LEDGER_NAMESPACE" \
            --closure "$out/closure.json" \
            --out "$out/readback.json"
          {
            echo "### intr-destination self-closure"
            echo '```json'
            cat "$out/readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: organization-ledger-transition
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
